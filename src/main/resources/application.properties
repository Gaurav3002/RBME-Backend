spring.application.name=rbmApis
server.port=9292

spring.datasource.url=jdbc:postgresql://localhost:5432/rbme
spring.datasource.username=postgres
spring.datasource.password=221288
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=never

jwt.secret=YourVeryLongSecretKeyWhichShouldBeAtLeast32CharactersLong123456
jwt.expiration=86400000

app.upload.path=D:/RBME/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
